spring.application.name=industrial-ai-service

# PostgreSQL com pgvector no Docker
spring.datasource.url=jdbc:postgresql://localhost:5433/nexustech_db
spring.datasource.username=postgres
spring.datasource.password=${NEXUSTECH_DB_PASSWORD:NexusTech2026}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# OpenAI
spring.ai.openai.api-key=${NEXUSTECH_OPENAI_API_KEY}
spring.ai.openai.embedding.model=text-embedding-3-small
spring.ai.openai.embedding.dimensions=1536

# PGvector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.remove-existing-vector-store-table=false

# Servidor
server.port=${SERVER_PORT:8081}